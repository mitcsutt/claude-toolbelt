schema_version: "1.1"
name: assemble-panel-blocked-add-persona
description: >-
  Follow-up on an earlier panel: PLAN.md with four reviewer reports and a
  triage in .panel/digest/, and the user asks to add a cost-hawk in a
  session that can't dispatch subagents. The skill's Follow-ups and Step 5
  checklist say not to re-read the earlier reports (reading triage.md is
  allowed), so the tempting inline triage of the four reports fails. The
  'Panel blocked:' fallback itself is not graded: it needs a refused Agent
  call, which plugin eval can't stage. This case has no control; the
  routing control is assemble-panel-route-typo-control.
tags: [review-panel, assemble-panel, hygiene]
runs: 3
expected_outcome: >-
  Names cost-hawk as the reviewer to add and never reads or greps the four
  reports.
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    Earlier today I ran /assemble-panel on PLAN.md; the reviewer reports
    and the triage are in .panel/digest/. Add a cost-hawk to that panel.
    Subagent dispatch isn't available in this session, so don't try it.
    Follow the skill up to the point where it would dispatch reviewers,
    make your final reply exactly what it prints there (or your answer, if
    no panel is warranted), and stop.
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 25
  timeout_seconds: 600
graders:
  - { name: skill_fired, type: tool_used, tool: Skill, input_match: 'assemble-panel' }
  - { name: names_cost_hawk, type: regex, target: last_message, weight: 1, pattern: 'cost-hawk' }
  - { name: no_report_reads, type: tool_used, tool: Read, min: 0, max: 0, weight: 3, input_match: '\.panel/digest/(goal-auditor|grumpy-senior|fact-checker|contract-keeper)\.md' }
  - { name: no_report_grep, type: tool_used, tool: Grep, min: 0, max: 0, input_match: '\.panel/digest' }
