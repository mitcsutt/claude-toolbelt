schema_version: "1.1"
name: assemble-panel-route-build-vs-buy
description: >-
  A build-vs-buy decision for a feature-flag service, with the user asking
  for a grumpy senior dev. The user's pick wins and the decision core adds
  outsider; the roster stays 2-4 with no ad-hoc general-purpose persona.
  Agent is withheld (fixture hooks don't load under claude plugin eval),
  so routing is graded from the roster the skill prints before dispatch,
  in the final message (the trace also holds SKILL.md's example roster).
  This case has no control; the routing control is
  assemble-panel-route-typo-control.
tags: [review-panel, assemble-panel, routing]
runs: 3
expected_outcome: >-
  Prints a roster of 2-4 with grumpy-senior and outsider, no
  general-purpose persona, and the status line.
context:
  scaffold_script: fixture.sh
execution:
  prompt: >-
    Should we build our own feature-flag service? DECISION.md has the
    proposal. Get a panel on it and make one reviewer a grumpy senior dev.
    Subagent dispatch isn't available in this session, so don't try it.
    Follow the skill up to the point where it would dispatch reviewers,
    make your final reply exactly what it prints there (or your answer, if
    no panel is warranted), and stop.
  allowed_tools: [Skill, Read, Grep, Glob]
  max_turns: 25
  timeout_seconds: 600
graders:
  - { name: skill_fired, type: tool_used, tool: Skill, input_match: 'assemble-panel' }
  - { name: user_pick_grumpy_senior, type: regex, target: last_message, flags: s, weight: 3, pattern: 'Panel \(\d+ \+ filter\)(?:(?!Skipped|Claim owner).)*?\n\s*(?:[-*]|\d+\.) \**`?grumpy-senior\b' }
  - { name: core_outsider, type: regex, target: last_message, flags: s, weight: 2, pattern: 'Panel \(\d+ \+ filter\)(?:(?!Skipped|Claim owner).)*?\n\s*(?:[-*]|\d+\.) \**`?outsider\b' }
  - { name: size_2_to_4, type: regex, target: last_message, weight: 1, pattern: 'Panel \((2|3|4) \+ filter\)' }
  - { name: no_adhoc_persona, type: regex, target: last_message, match: not_contains, weight: 2, pattern: 'general-purpose' }
  # shared graders, in every case that prints a roster:
  - { name: roster_printed, type: regex, target: last_message, pattern: 'Panel \(\d+ \+ filter\)' }
  - { name: status_line, type: regex, target: last_message, weight: 2, pattern: 'Expect about \d+\s*[–-]\s*\d+ min' }
