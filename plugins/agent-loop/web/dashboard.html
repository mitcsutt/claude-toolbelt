<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-loop</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   agent-loop console.
   One question first: is the loop healthy, or is it broken? The state word is
   a small tag; the sentence explaining it is the headline. That inversion is
   deliberate — the old page shouted HALTED between agent hand-offs, and a
   one-word verdict with no reason is exactly what made that lie readable.
   Everything below the health band is quiet: hairline bands, no shadows, no
   ambient gradients, colour used only as signal.
   ───────────────────────────────────────────────────────────────────────── */
:root {
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --bg:#f2f3f6; --surface:#ffffff; --surface-2:#f7f8fa; --surface-3:#eceef3;
  --ink:#15181d; --ink-2:#59616f; --ink-3:#8c93a1;
  --rule:#dde0e6; --rule-2:#c6cad3;

  --ok:#0f7346;    --ok-bg:#e2f1e9;   --ok-edge:#2f9c68;
  --warn:#8a5800;  --warn-bg:#f9eed6; --warn-edge:#c98f18;
  --bad:#a82a1d;   --bad-bg:#fae4e1;  --bad-edge:#cf4c3c;
  --info:#23479f;  --info-bg:#e4e9f9; --info-edge:#4f74d4;
  --idle:#767e8d;  --idle-bg:#e9ebef; --idle-edge:#a8aeba;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0e1114; --surface:#15181d; --surface-2:#1a1e24; --surface-3:#22272e;
    --ink:#e7eaef; --ink-2:#98a0ad; --ink-3:#6f7784;
    --rule:#252a31; --rule-2:#343b45;

    --ok:#57c88d;    --ok-bg:#12281e;   --ok-edge:#3ba36c;
    --warn:#dda033;  --warn-bg:#2c2312; --warn-edge:#b8811f;
    --bad:#f4796a;   --bad-bg:#2f1815;  --bad-edge:#c9513f;
    --info:#7fa0f5;  --info-bg:#171d2e; --info-edge:#4f74d4;
    --idle:#8b93a1;  --idle-bg:#1e2229; --idle-edge:#454d59;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--info-edge); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
.band { background: var(--surface); border-bottom: 1px solid var(--rule); }
.band > .wrap { padding-block: 18px; }
.mono { font-family: var(--mono); }
.dim { color: var(--ink-2); }

/* ── banner ─────────────────────────────────────────────────────── */
#banner {
  background: var(--warn-bg); color: var(--warn);
  border-bottom: 1px solid var(--warn-edge);
  font-size: 12.5px; font-weight: 500;
}
#banner > .wrap { padding-block: 7px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
#banner code { font-family: var(--mono); font-size: 11px; color: inherit; }
#banner.terminal { background: var(--idle-bg); color: var(--ink-2); border-bottom-color: var(--rule-2); }

/* ── masthead ───────────────────────────────────────────────────── */
.mast > .wrap {
  padding-block: 12px; display: flex; flex-wrap: wrap; gap: 10px 16px;
  align-items: baseline; justify-content: space-between;
}
.ident { min-width: 0; }
.ident h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.ident h1 .prod { color: var(--ink-3); font-weight: 500; }
.ident p {
  margin: 1px 0 0; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52ch;
}
.ctrls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button {
  font: inherit; font-size: 12.5px; line-height: 1.2; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--rule-2); border-radius: 6px;
  padding: 6px 11px; cursor: pointer;
}
button:hover:not(:disabled) { background: var(--surface-3); }
button:disabled { opacity: .38; cursor: not-allowed; }
#btnStart:not(:disabled), #btnResume:not(:disabled) { color: var(--ok); border-color: var(--ok-edge); }
#btnStop:not(:disabled) { color: var(--bad); border-color: var(--bad-edge); }
#artifacts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
#artifacts figure { margin: 0; max-width: 220px; }
#artifacts img { display: block; width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 4px; }
#artifacts figcaption { font-size: 11px; opacity: .75; margin-top: 4px; word-break: break-all; }
.dec { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 12px; }
.dec time { margin-left: auto; opacity: .6; }
.dec .cls { opacity: .7; }
#btnBell { padding: 6px 8px; }
#btnBell[aria-pressed="true"] { color: var(--info); border-color: var(--info-edge); }
#ctrlErr {
  font-size: 12px; color: var(--bad); background: var(--bad-bg);
  border: 1px solid var(--bad-edge); border-radius: 6px; padding: 5px 9px;
}

/* ── health band: the one loud thing on the page ─────────────────── */
.health { background: var(--surface-2); }
.health > .wrap { padding-block: 22px 20px; }
.statusline { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
#status {
  display: inline-flex; align-items: baseline; gap: 7px;
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  letter-spacing: .06em; padding: 4px 10px; border-radius: 3px;
  border: 1px solid currentColor;
}
#status .glyph { font-size: 11px; }
.statusline .meta { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.statusline .meta b { color: var(--ink); font-weight: 600; }

#why {
  margin: 12px 0 0; max-width: 60ch;
  font-size: clamp(19px, 4.4vw, 27px); font-weight: 400; line-height: 1.28;
  letter-spacing: -0.015em; text-wrap: balance;
}

#callout {
  margin-top: 14px; border: 1px solid var(--bad-edge); background: var(--bad-bg);
  border-radius: 6px; padding: 12px 14px;
}
#callout h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--bad); }
#callout p { margin: 0; font-size: 13.5px; color: var(--ink); max-width: 72ch; }
#callout p + p { margin-top: 7px; color: var(--ink-2); }
#callout.soft { border-color: var(--rule-2); background: var(--surface-3); }
#callout.soft h2 { color: var(--ink); }
.resume { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.resume code {
  font-family: var(--mono); font-size: 11.5px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--rule-2); border-radius: 4px;
  padding: 5px 8px; overflow-x: auto; white-space: pre; max-width: 100%;
}
.copybtn { padding: 4px 9px; font-size: 11.5px; }

/* vitals: instrument readouts, colour on the leading edge only */
#health { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.vital {
  flex: 1 1 210px; min-width: 0; display: flex; flex-direction: column; gap: 1px;
  padding: 7px 11px; background: var(--surface);
  border: 1px solid var(--rule); border-left-width: 3px; border-radius: 0 5px 5px 0;
}
.vital .vk { font-size: 11px; color: var(--ink-2); }
.vital .vv { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
.v-ok   { border-left-color: var(--ok-edge); }
.v-warn { border-left-color: var(--warn-edge); background: var(--warn-bg); }
.v-bad  { border-left-color: var(--bad-edge); background: var(--bad-bg); }
.v-idle { border-left-color: var(--idle-edge); }
.v-warn .vk, .v-warn .vv { color: var(--warn); }
.v-bad  .vk, .v-bad  .vv { color: var(--bad); }

/* ── section furniture ──────────────────────────────────────────── */
.hd { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 12px; }
.hd h2 { margin: 0; font-size: 13px; font-weight: 600; }
.hd .note { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.hd .grow { flex: 1; }
.empty { font-size: 13px; color: var(--ink-3); }

/* ── tick timeline ──────────────────────────────────────────────── */
.stepper { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; }
.node {
  flex: 1 1 150px; min-width: 0; padding: 9px 12px 10px;
  border: 1px solid var(--rule); border-right-width: 0; background: var(--surface-2);
}
.node:first-child { border-radius: 5px 0 0 5px; }
.node:last-child { border-right-width: 1px; border-radius: 0 5px 5px 0; }
.node .top { display: flex; align-items: center; gap: 7px; }
.node .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle-edge); flex: none; }
.node .role { font-size: 13px; font-weight: 600; }
.node .sub { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.node .desc {
  margin-top: 5px; font-size: 12px; color: var(--ink-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.node.n-done { background: var(--surface); }
.node.n-done .dot { background: var(--ok-edge); }
.node.n-active { background: var(--info-bg); border-color: var(--info-edge); }
.node.n-active .dot { background: var(--info-edge); }
.node.n-pending { opacity: .62; }
.node.n-parked { background: var(--surface); }
.node.n-parked .dot { background: var(--idle-edge); }
.chip {
  font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 3px;
  border: 1px solid var(--rule-2); color: var(--ink-2); background: var(--surface);
}
.chip.m-opus   { color: var(--warn); border-color: var(--warn-edge); }
.chip.m-sonnet { color: var(--info); border-color: var(--info-edge); }
.chip.m-haiku  { color: var(--ok);   border-color: var(--ok-edge); }
.chip.t { color: var(--ink-3); border-style: dashed; }

.meter { margin-top: 12px; }
.meter .track { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.meter .fill { height: 100%; background: var(--info-edge); }
.meter .fill.warn { background: var(--warn-edge); }
.meter .fill.bad { background: var(--bad-edge); }
.meter .cap { margin-top: 5px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.meter .cap.off { color: var(--ink-3); }

.strip { margin-top: 18px; }
.strip .bars { display: flex; align-items: flex-end; gap: 4px; height: 40px; }
.strip .cell { flex: 1 1 0; min-width: 0; max-width: 58px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.strip .bar { border-radius: 2px 2px 0 0; min-height: 4px; background: var(--idle-edge); }
.strip .cell.c-ok   .bar { background: var(--ok-edge); }
.strip .cell.c-warn .bar { background: var(--warn-edge); }
.strip .cell.c-bad  .bar { background: var(--bad-edge); }
.strip .cell.c-live .bar { background: var(--info-edge); }
.strip .nums { display: flex; gap: 4px; margin-top: 4px; }
.strip .num { flex: 1 1 0; min-width: 0; max-width: 58px; text-align: center; font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.strip .cap { margin-top: 6px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }

#activity { margin-top: 18px; border-top: 1px solid var(--rule); max-height: 208px; overflow-y: auto; }
.act {
  display: flex; gap: 10px; align-items: baseline; padding: 3px 0;
  border-bottom: 1px solid var(--rule); font-size: 12.5px;
}
.act .r { font-size: 11px; color: var(--ink-3); width: 66px; flex: none; }
.act .n { font-family: var(--mono); font-size: 11.5px; width: 62px; flex: none; color: var(--ink-2); }
.act .d { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; }
.act .t { font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex: none; }

/* ── roadmap ────────────────────────────────────────────────────── */
.seg { border-top: 1px solid var(--rule); }
.seg:last-child { border-bottom: 1px solid var(--rule); }
.seg > summary {
  list-style: none; cursor: pointer; padding: 9px 0;
  display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: baseline;
}
.seg > summary::-webkit-details-marker { display: none; }
.seg .mark { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.seg.s-done .mark { color: var(--ok); }
.seg.s-current .mark { color: var(--info); }
.seg .nm { font-size: 13.5px; min-width: 0; }
.seg .goal { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.seg .cnt { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.seg .segbar { grid-column: 2 / -1; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.seg .segbar i { display: block; height: 100%; background: var(--ok-edge); }
.seg.s-current .segbar i { background: var(--info-edge); }
.tasks { padding: 2px 0 10px 24px; }
.task { display: flex; gap: 9px; align-items: baseline; padding: 2px 0; font-size: 12.5px; }
.task .g { font-family: var(--mono); font-size: 11px; width: 12px; flex: none; color: var(--ink-3); }
.task .id { font-family: var(--mono); font-size: 11.5px; width: 40px; flex: none; color: var(--ink-2); }
.task .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task.k-done { color: var(--ink-3); }
.task.k-done .g { color: var(--ok); }
.task.k-doing .g { color: var(--info); }
.task.k-blocked .g, .task.k-blocked .tx { color: var(--bad); }

/* ── incidents ──────────────────────────────────────────────────── */
.inc { display: grid; grid-template-columns: 3px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); }
#incidents .inc:last-child { border-bottom: 1px solid var(--rule); }
.inc .edge { border-radius: 2px; background: var(--idle-edge); }
.inc.sev-warn .edge { background: var(--warn-edge); }
.inc.sev-error .edge { background: var(--bad-edge); }
.inc.sev-needs-human .edge { background: var(--bad-edge); }
.inc .row1 { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.inc .kind { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
.inc.sev-error .kind, .inc.sev-needs-human .kind { color: var(--bad); }
.inc.sev-warn .kind { color: var(--warn); }
.inc .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.inc .detail { margin-top: 3px; font-size: 13px; color: var(--ink-2); max-width: 80ch; }
.inc .medic { margin-top: 6px; font-size: 12.5px; color: var(--ink-2); max-width: 80ch; }
.badge {
  font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 3px;
  border: 1px solid var(--rule-2); color: var(--ink-2);
}
.badge.o-resumed { color: var(--ok); border-color: var(--ok-edge); }
.badge.o-paused, .badge.o-escalated { color: var(--bad); border-color: var(--bad-edge); }

/* ── usage ──────────────────────────────────────────────────────── */
.ugrid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; }
.ubar { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; padding: 3px 0; }
.ubar .ml { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.ubar .tr { height: 8px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.ubar .tr i { display: block; height: 100%; background: var(--info-edge); }
.ubar.m-opus .tr i { background: var(--warn-edge); }
.ubar.m-haiku .tr i { background: var(--ok-edge); }
.ubar .vl { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.fig .k { font-size: 11px; color: var(--ink-2); }
.fig .v { font-family: var(--mono); font-size: 17px; letter-spacing: -0.02em; }
.fig .s { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

/* ── log ────────────────────────────────────────────────────────── */
.logbox > summary { cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; }
.logbox > summary::-webkit-details-marker { display: none; }
.logbox > summary::before { content: "▸ "; color: var(--ink-3); }
.logbox[open] > summary::before { content: "▾ "; }
#log {
  margin: 10px 0 0; padding: 10px 12px; background: var(--surface-2);
  border: 1px solid var(--rule); border-radius: 5px;
  font-family: var(--mono); font-size: 11.5px; line-height: 1.65; color: var(--ink-2);
  overflow-x: auto; white-space: pre;
}
footer { color: var(--ink-3); font-size: 11.5px; font-family: var(--mono); }
footer > .wrap { padding-block: 14px 26px; display: flex; flex-wrap: wrap; gap: 4px 14px; }

@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.live .glyph { animation: breathe 2.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .live .glyph { animation: none; } }

@media (max-width: 720px) {
  .ugrid { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .node { flex: 1 1 100%; border-right-width: 1px; border-bottom-width: 0; border-radius: 0; }
  .node:first-child { border-radius: 5px 5px 0 0; }
  .node:last-child { border-bottom-width: 1px; border-radius: 0 0 5px 5px; }
  .ident p { max-width: 100%; }
  .act .r { display: none; }
  .ubar { grid-template-columns: 72px 1fr auto; }
}
</style>
</head>
<body>

<div id="banner" class="band" hidden><div class="wrap">
  <span id="bannerText"></span>
  <code id="bannerCmd" hidden></code>
  <button id="bannerCopy" class="copybtn" type="button" hidden>Copy</button>
</div></div>

<header class="band mast">
  <div class="wrap">
    <div class="ident">
      <h1><span class="prod">agent-loop</span> <span id="loopName">…</span></h1>
      <p id="worktree"></p>
    </div>
    <div class="ctrls">
      <span id="ctrlErr" hidden></span>
      <button id="btnStart" type="button">Start</button>
      <button id="btnPause" type="button" title="Finish the phase in flight, then stop">Pause</button>
      <button id="btnStop" type="button" title="Stop at the next phase boundary — minutes, not the rest of the tick">Stop now</button>
      <button id="btnResume" type="button">Resume</button>
      <button id="btnBell" type="button" aria-pressed="false" title="Notify me when the loop stalls or needs a human">Notify me</button>
    </div>
  </div>
</header>

<section class="band health" aria-label="Loop health">
  <div class="wrap">
    <div class="statusline">
      <span id="status" class="s-idle"><span class="glyph">·</span><span class="word">IDLE</span></span>
      <span class="meta">tick <b id="tickNo">–</b></span>
      <span class="meta" id="since"></span>
    </div>
    <p id="why">Waiting for the first snapshot.</p>
    <div id="callout" hidden></div>
    <div id="health"></div>
  </div>
</section>

<section class="band" aria-label="This tick">
  <div class="wrap">
    <div class="hd"><h2>This tick</h2><span class="grow"></span><span class="note" id="tickNote"></span></div>
    <div id="timeline"></div>
    <div id="activity"></div>
    <div id="artifacts" hidden></div>
  </div>
</section>

<section class="band" aria-label="Roadmap">
  <div class="wrap">
    <div class="hd"><h2>Roadmap</h2><span class="grow"></span><span class="note" id="progNote"></span></div>
    <div id="roadmap"></div>
  </div>
</section>

<section class="band" aria-label="Incidents">
  <div class="wrap">
    <div class="hd"><h2>Incidents</h2><span class="grow"></span><span class="note" id="incNote"></span></div>
    <div id="incidents"></div>
  </div>
</section>

<section class="band" aria-label="Decisions">
  <div class="wrap">
    <div class="hd"><h2>Decisions</h2><span class="grow"></span><span class="note" id="decNote"></span></div>
    <div id="decisions"></div>
  </div>
</section>

<section class="band" aria-label="Effort">
  <div class="wrap">
    <div class="hd"><h2>Effort</h2><span class="grow"></span><span class="note" id="quotaNote"></span></div>
    <div id="usage"></div>
  </div>
</section>

<section class="band" aria-label="Log">
  <div class="wrap">
    <details class="logbox" data-key="log">
      <summary id="logName">harness.log, last lines</summary>
      <pre id="log"></pre>
    </details>
  </div>
</section>

<footer><div class="wrap"><span id="footVersion"></span><span id="footDash"></span><span id="footElapsed"></span></div></footer>

<script>
"use strict";
/* Reads the Snapshot contract and nothing else. No field is invented; where the
   contract omits something (the stall threshold) the default is a named constant
   below and is documented as an assumption, not fabricated into the payload. */

// #mock renders this constant, kept byte-identical to tests/fixtures/snapshot-sample.json
const MOCK = {
  "loop": {
    "name": "2026-09-11-internal-app",
    "worktree": "/Users/dev/work/internal-app.loop",
    "status": "running",
    "tick": 12,
    "plugin_version": "2.1.0",
    "schema": 2,

  setText($("why"), s.why || "No reason reported.");

  const co = $("callout");
  const CALLOUT_TITLE = {
    "needs-human": "This loop needs a human", crashed: "The harness is gone",
    halted: "The loop halted", paused: "The loop is paused", stopped: "The loop stopped"
  };
  if (CALLOUT_TITLE[state]) {
    const incs = d.incidents || [];
    const last = incs.length ? incs[incs.length - 1] : null;
    const medic = last && last.medic ? last.medic : null;
    const title = CALLOUT_TITLE[state];
    co.className = (state === "paused" || state === "stopped") ? "soft" : "";
    // #why already carries status.why as the headline directly above. Repeating it
    // verbatim here reads as a stutter, so the callout leads with the incident that
    // caused the state and falls back to the why text when no incident was recorded.
    const lede = last && state !== "paused" && state !== "stopped"
      ? (last.kind || "incident") + " " + last.id + (last.tick != null ? " · tick " + last.tick : "") +
        (last.detail ? " — " + last.detail : "")
      : (s.why || "");
    morphInner(co, "<h2>" + esc(title) + "</h2><p>" + esc(lede) + "</p>" +
      (medic && medic.summary ? "<p>Medic (" + esc(medic.outcome || "?") + "): " + esc(medic.summary) + "</p>" : "") +
      resumeLine(s.resume_cmd));
    co.hidden = false;
  } else {
    co.hidden = true;
  }
}

function vital(key, tone, label, value) {
  return '<div class="vital v-' + tone + '" data-key="' + key + '">' +
         '<span class="vk">' + esc(label) + '</span>' +
         '<span class="vv">' + esc(value) + '</span></div>';
}
function renderHealth(d) {
  const h = d.health || {};
  const ha = h.harness || {}, tk = h.tick || {}, db = h.dashboard || {};
  const out = [];

  const hb = ha.heartbeat_age_s;
  let tone = "ok", val;
  if (!ha.alive) { tone = "bad"; val = ha.pid ? "pid " + ha.pid + " not running" : "not running"; }
  else if (hb == null) { tone = "warn"; val = "pid " + (ha.pid != null ? ha.pid : "?") + " · no heartbeat"; }
  else {
    tone = hb > HB_BAD_S ? "bad" : hb > HB_WARN_S ? "warn" : "ok";
    val = "pid " + (ha.pid != null ? ha.pid : "?") + " · hb " + fmtAge(hb);
  }
  out.push(vital("harness", tone, "harness", val));

  if (tk.alive) {
    const el = num(tk.elapsed_s, 0), to = num(tk.timeout_s, 0);
    const t2 = to && el >= to ? "bad" : to && el > to * 0.8 ? "warn" : "ok";
    out.push(vital("tick", t2, "tick " + (tk.tick != null ? tk.tick : "?"),
      fmtDur(el) + (to ? " of " + fmtDur(to) : "") + (tk.pid != null ? " · pid " + tk.pid : "")));
  } else {
    out.push(vital("tick", "idle", "tick", "no tick running"));
  }

  const aa = tk.activity_age_s, stall = num(tk.stall_s, STALL_S_DEFAULT);
  if (aa == null) out.push(vital("activity", "idle", "activity", "nothing seen yet"));
  else out.push(vital("activity", aa >= stall ? "bad" : aa > ACTIVITY_WARN_S ? "warn" : "ok",
                      "activity", fmtAge(aa) + " ago"));

  if (db.pid != null || db.alive != null) {
    const label = db.sidecar ? "dashboard (sidecar)" : "dashboard";
    if (db.alive === false) {
      out.push(vital("dash", "bad", label, (db.pid != null ? "pid " + db.pid + " " : "") + "not running"));
    } else {
      out.push(vital("dash", "ok", label,
                     (db.pid != null ? "pid " + db.pid + " · " : "") + "up " + fmtAge(db.uptime_s)));
    }
  }
  morphInner($("health"), out.join(""));
}

function nodeHtml(key, role, model, state, tools, desc, elapsed) {
  const chips = [];
  if (model) chips.push('<span class="chip m-' + modelTier(model) + '">' + esc(modelLabel(model)) + "</span>");
  if (typeof tools === "number") chips.push('<span class="chip t">' + tools + " tools</span>");
  if (elapsed != null) chips.push('<span class="chip t">' + esc(fmtDur(elapsed)) + "</span>");
  return '<div class="node n-' + esc(state) + '" data-key="' + esc(key) + '">' +
    '<div class="top"><span class="dot"></span><span class="role">' + esc(role) + "</span></div>" +
    '<div class="sub">' + chips.join("") + "</div>" +
    (desc ? '<div class="desc" title="' + esc(desc) + '">' + esc(desc) + "</div>" : "") +
    "</div>";
}
function tickTone(t) {
  if (t.verdict === "halt") return "bad";
  if (t.cause === "ok") return "ok";
  if (t.cause === "killed" || t.cause === "timeout" || t.cause === "crashed") return "bad";
  return "warn";
}
function renderTimeline(d) {
  const now = snapNow(d);
  const p = d.pipeline || {};
  const tk = (d.health && d.health.tick) || {};
  const cfg = d.config || {};
  const nodes = [];
  const cur = d.current || {};
  // A dead harness or a terminal state means no phase is running, whatever the
  // last pipeline event said. Parked nodes stop claiming to be live.
  const frozen = !(d.health && d.health.harness && d.health.harness.alive) ||
                 TERMINAL.has((d.status || {}).state);
  const park = st => (frozen && st === "active") ? "parked" : (st || "pending");
  nodes.push(nodeHtml("n-root", p.role || "orchestrator", cfg.orchestrator_model, park(p.state),
                      undefined, cur.task ? "tick " + (cur.tick != null ? cur.tick : "?") + " · " + cur.task : "", null));
  setText($("tickNote"), [cur.task, cur.role, typeof cur.tools === "number" ? cur.tools + " tools" : null]
                          .filter(Boolean).join(" · "));
  const kids = Array.isArray(p.children) ? p.children : [];
  const activeRole = p.active && p.active.role;
  kids.forEach((c, i) => {
    const isActive = !frozen && (c.state === "active" || (c.role === activeRole && c.state !== "done"));
    const since = isActive && p.active ? p.active.since : null;
    nodes.push(nodeHtml("n-" + i + "-" + (c.role || "?"), c.role || "?", c.model, park(c.state),
                        typeof c.tools === "number" ? c.tools : undefined, c.desc || "",
                        since ? Math.max(0, now - since) : null));
  });

  const el = num(tk.elapsed_s, 0), to = num(tk.timeout_s, 0);
  const pctEl = to ? Math.min(100, Math.round(el * 100 / to)) : 0;
  const fillTone = to && el >= to ? "bad" : to && el > to * 0.8 ? "warn" : "";
  const meter = (tk.alive && to)
    ? '<div class="meter"><div class="track"><div class="fill ' + fillTone + '" style="width:' + pctEl + '%"></div></div>' +
      '<div class="cap">' + esc(fmtDur(el)) + " of " + esc(fmtDur(to)) + " tick budget · " + esc(fmtDur(Math.max(0, to - el))) + " left</div></div>"
    : '<div class="meter"><div class="cap off">no tick running</div></div>';

  const ticks = (Array.isArray(d.ticks) ? d.ticks : []).slice(-TICK_CELLS);
  let strip = "";
  if (ticks.length) {
    const live = tk.alive ? [{tick: tk.tick, dur: el, cause: "live", verdict: "live", task: (d.current && d.current.task) || "", live: true}] : [];
    const cells = ticks.concat(live);
    const max = Math.max.apply(null, cells.map(t => num(t.dur, 0)).concat([1]));
    const bars = cells.map(t => {
      const h = Math.max(4, Math.round(num(t.dur, 0) * 100 / max));
      const tone = t.live ? "live" : tickTone(t);
      const tip = "t" + t.tick + (t.task ? " · " + t.task : "") + " · " + fmtDur(t.dur) +
                  " · " + (t.live ? "in flight" : (t.verdict || "?") + "/" + (t.cause || "?")) +
                  (t.sha ? " · " + t.sha : "");
      return '<div class="cell c-' + tone + '" data-key="c' + t.tick + '" title="' + esc(tip) + '">' +
             '<div class="bar" style="height:' + h + '%"></div></div>';
    }).join("");
    const nums = cells.map(t => '<div class="num" data-key="n' + t.tick + '">' + esc(t.tick) + "</div>").join("");
    strip = '<div class="strip"><div class="bars">' + bars + '</div><div class="nums">' + nums +
            '</div><div class="cap">recent ticks — bar height is duration, colour is cause</div></div>';
  }
  morphInner($("timeline"), '<div class="stepper">' + nodes.join("") + "</div>" + meter + strip);
}

function renderActivity(d) {
  const now = snapNow(d);
  const rows = (Array.isArray(d.activity) ? d.activity : []).slice(-ACTIVITY_ROWS).reverse();
  if (!rows.length) { morphInner($("activity"), '<div class="act"><span class="d dim">no tool activity yet</span></div>'); return; }
  morphInner($("activity"), rows.map((a, i) =>
    '<div class="act" data-key="a' + i + "-" + esc(a.t) + '">' +
    '<span class="r">' + esc(a.role || "") + "</span>" +
    '<span class="n">' + esc(a.name || "") + "</span>" +
    '<span class="d" title="' + esc(a.desc || "") + '">' + esc(a.desc || "") + "</span>" +
    '<span class="t">' + esc(a.t ? fmtAge(now - a.t) : "") + "</span></div>").join(""));
}

function renderRoadmap(d) {
  const pr = d.progress || {};
  const segBasis = pr.pct_basis === "segments";
  // Honest header: with unplanned segments left, "48/48" is planned work only —
  // never let it read as 100% of the job.
  const pct = num(pr.pct, 0);
  const shown = segBasis ? Math.min(99, pct) : pct;
  const head = segBasis
    ? "seg " + num(pr.segments_done, 0) + "/" + num(pr.segments_total, 0) +
      " · " + num(pr.done, 0) + "/" + num(pr.total, 0) + " planned tasks · " + shown + "% (segment-weighted)"
    : num(pr.done, 0) + "/" + num(pr.total, 0) + " tasks · " + shown + "%";
  setText($("progNote"), head);

  const segs = Array.isArray(d.roadmap) ? d.roadmap : [];
  if (!segs.length) { morphInner($("roadmap"), '<div class="empty">no plan parsed yet</div>'); return; }
  const plan = Array.isArray(d.plan) ? d.plan : [];
  const MARK = {done: "✓", current: "▶", future: "·"};
  const GL = {done: "✓", doing: "◐", pending: "☐", blocked: "!", skipped: "–"};
  const html = segs.map((s, i) => {
    const key = "seg" + i;
    const total = num(s.total, 0), done = num(s.done, 0);
    const w = total ? Math.round(done * 100 / total) : 0;
    const count = s.planned ? done + "/" + total : "not planned yet";
    const tasks = plan.filter(t => t.segment === s.name).slice(0, ROADMAP_TASKS);
    const body = tasks.length
      ? '<div class="tasks">' + tasks.map(t =>
          '<div class="task k-' + esc(t.status) + '" data-key="' + esc(t.id) + '">' +
          '<span class="g">' + esc(GL[t.status] || "·") + "</span>" +
          '<span class="id">' + esc(t.id) + "</span>" +
          '<span class="tx" title="' + esc(t.desc || "") + '">' + esc(t.desc || "") + "</span></div>").join("") + "</div>"
      : '<div class="tasks"><span class="empty">' + (s.planned ? "no task rows" : "this segment is not broken into tasks yet") + "</span></div>";
    return '<details class="seg s-' + esc(s.state) + '" data-key="' + key + '"' + openAttr(key) + ">" +
      "<summary>" +
      '<span class="mark">' + esc(MARK[s.state] || "·") + "</span>" +
      '<span class="nm">' + esc(s.name) + (s.goal ? '<span class="goal">' + esc(s.goal) + "</span>" : "") + "</span>" +
      '<span class="cnt">' + esc(count) + "</span>" +
      (s.planned ? '<span class="segbar"><i style="width:' + w + '%"></i></span>' : "") +
      "</summary>" + body + "</details>";
  }).join("");
  morphInner($("roadmap"), html);
}

function renderIncidents(d) {
  const now = snapNow(d);
  const list = (Array.isArray(d.incidents) ? d.incidents : []).slice().reverse();
  setText($("incNote"), list.length ? list.length + (list.length === 1 ? " raised this run" : " raised this run") : "");
  if (!list.length) { morphInner($("incidents"), '<div class="empty">no incidents</div>'); return; }
  morphInner($("incidents"), list.map(x =>
    '<div class="inc sev-' + esc(x.severity || "warn") + '" data-key="' + esc(x.id) + '">' +
    '<span class="edge"></span><div>' +
    '<div class="row1"><span class="kind">' + esc(x.kind || "incident") + "</span>" +
    '<span class="when">' + esc(x.id) + (x.tick != null ? " · tick " + x.tick : "") +
    (x.t ? " · " + fmtAge(now - x.t) + " ago" : "") + "</span>" +
    (x.medic && x.medic.outcome ? '<span class="badge o-' + esc(x.medic.outcome) + '">medic: ' + esc(x.medic.outcome) + "</span>" : "") +
    "</div>" +
    '<div class="detail">' + esc(x.detail || "") + "</div>" +
    (x.medic && x.medic.summary ? '<div class="medic">' + esc(x.medic.summary) + "</div>" : "") +
    "</div></div>").join(""));
}

function renderUsage(d) {
  const u = d.usage || {};
  const by = u.by_model || {};
  const keys = Object.keys(by).sort((a, b) => num(by[b].tokens, 0) - num(by[a].tokens, 0));
  const max = Math.max.apply(null, keys.map(k => num(by[k].tokens, 0)).concat([1]));
  const bars = keys.length ? keys.map(k => {
    const m = by[k];
    return '<div class="ubar m-' + modelTier(k) + '" data-key="u' + esc(k) + '">' +
      '<span class="ml" title="' + esc(k) + '">' + esc(modelLabel(k)) + "</span>" +
      '<span class="tr"><i style="width:' + Math.round(num(m.tokens, 0) * 100 / max) + '%"></i></span>' +
      '<span class="vl">' + esc(fmtTok(m.tokens)) + " · " + esc(fmtUsd(m.cost_usd)) + "</span></div>";
  }).join("") : '<div class="empty">no usage recorded yet</div>';

  const pt = u.per_task || {}, burn = u.burn || {};
  const figs =
    '<div class="figs">' +
    fig("total spend", fmtUsd(u.total_cost_usd), fmtTok(u.total_tokens) + " tokens") +
    fig("per task", fmtUsd(pt.cost_usd), fmtTok(pt.tokens) + " tokens") +
    fig("burn", fmtUsd(burn.usd_per_hr) + "/h", fmtTok(burn.tok_per_min) + " tok/min") +
    fig("cache reads", num(u.cache_read_pct, 0) + "%", fmtTok(u.cache_read_tokens) + " tokens") +
    "</div>";
  morphInner($("usage"), '<div class="ugrid"><div>' + bars + "</div><div>" + figs + "</div></div>");

  const q = d.quota;
  setText($("quotaNote"), !q ? "" :
    q.resets_at ? q.label + " window · resets " + clock(q.resets_at)
                : q.label + " window · within limits");
}
function fig(k, v, s) {
  return '<div class="fig" data-key="f' + k + '"><div class="k">' + esc(k) + '</div><div class="v">' +
         esc(v) + '</div><div class="s">' + esc(s) + "</div></div>";
}

function renderLog(d) {
  const lines = Array.isArray(d.log) ? d.log : [];
  const name = d.log_file || "harness.log";
  setText($("logName"), name + ", last lines");
  setText($("log"), lines.length ? lines.join("\n") : name + " is empty");
}

function renderArtifacts(d) {
  const cur = d.current || {};
  const items = Array.isArray(cur.artifacts) ? cur.artifacts : [];
  const el = $("artifacts");
  if (!items.length) { el.innerHTML = ""; el.hidden = true; return; }
  el.hidden = false;
  const q = a => "/api/artifact?tick=" + encodeURIComponent(cur.tick) +
                 "&name=" + encodeURIComponent(a.name);
  el.innerHTML = items.map(a =>
    '<figure><a href="' + esc(q(a)) + '" target="_blank" rel="noreferrer">' +
    '<img loading="lazy" alt="' + esc(a.name) + '" src="' + esc(q(a)) + '"></a>' +
    '<figcaption>' + esc(a.name) + '</figcaption></figure>').join("");
}

function renderDecisions(d) {
  const all = Array.isArray(d.decisions) ? d.decisions : [];
  const rows = all.slice(-8).reverse();
  setText($("decNote"), all.length ? all.length + " logged" : "");
  const el = $("decisions");
  if (!rows.length) {
    el.innerHTML = '<p class="note">Nothing decided autonomously yet. ' +
                   'Every entry here is also in LOOP_DECISIONS.md, for a human to ratify or reverse.</p>';
    return;
  }
  el.innerHTML = rows.map(r => {
    const into = Array.isArray(r.into) ? r.into.join(", ") : (r.into || "");
    return '<div class="dec"><b>' + esc(r.task || "—") + '</b>' +
           '<span>' + esc(r.decision || r.type || "") + '</span>' +
           (r.classification ? '<span class="cls">' + esc(r.classification) + '</span>' : "") +
           (r.attempt ? '<span class="cls">attempt ' + esc(r.attempt) + '</span>' : "") +
           (into ? '<span class="cls">→ ' + esc(into) + '</span>' : "") +
           '<time>' + esc(clock(r.t)) + '</time></div>';
  }).join("");
}

function renderFooter(d) {
  const db = (d.health && d.health.dashboard) || {};
  setText($("footVersion"), "agent-loop " + ((d.loop && d.loop.plugin_version) || "?")
    + (d.loop && d.loop.schema != null ? " · schema " + d.loop.schema : ""));
  setText($("footDash"), db.sidecar ? "dashboard: harness sidecar" : "dashboard: standalone");
  setText($("footElapsed"), "run elapsed " + fmtDur(d.elapsed_s));
}

let lastNotified = null;
function notify(d) {
  const st = (d.status || {}).state;
  if (st === lastNotified) return;
  if ((st === "stalled" || st === "needs-human") &&
      window.Notification && Notification.permission === "granted") {
    new Notification("agent-loop: " + st, {body: (d.status && d.status.why) || (d.loop && d.loop.name) || ""});
  }
  lastNotified = st;
}

/* ── paint ───────────────────────────────────────────────────────────── */
function paint(d) {
  try {
    const h = d.health || {};
    if (changed("mast", [d.loop, h.harness && h.harness.alive])) renderMast(d);
    if (changed("status", [d.status, d.loop && d.loop.tick, d.incidents && d.incidents.length])) renderStatus(d);
    if (changed("health", h)) renderHealth(d);
    if (changed("timeline", [d.pipeline, d.ticks, h.tick, d.current, d.config && d.config.orchestrator_model, d.elapsed_s])) renderTimeline(d);
    if (changed("activity", d.activity)) renderActivity(d);
    if (changed("artifacts", [d.current && d.current.artifacts, d.current && d.current.tick])) renderArtifacts(d);
    if (changed("roadmap", [d.roadmap, d.progress, d.plan])) renderRoadmap(d);
    if (changed("incidents", [d.incidents, d.elapsed_s])) renderIncidents(d);
    if (changed("decisions", d.decisions)) renderDecisions(d);
    if (changed("usage", [d.usage, d.quota])) renderUsage(d);
    if (changed("log", [d.log, d.log_file])) renderLog(d);
    if (changed("footer", [d.loop, h.dashboard, d.elapsed_s])) renderFooter(d);
    notify(d);
  } catch (e) {
    console.error("render error", e);
  }
}

let latest = null;
function render(d) {
  latest = d;
  if (document.hidden) return;   // hidden tab: keep the payload, do no DOM work
  paint(d);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && latest) paint(latest); });

/* ── transport ───────────────────────────────────────────────────────── */
function setBanner(on) {
  const b = $("banner");
  if (!on) { b.hidden = true; return; }
  const st = latest && latest.status ? latest.status.state : null;
  const terminal = st && TERMINAL.has(st);
  b.classList.toggle("terminal", !!terminal);
  setText($("bannerText"), terminal
    ? "Harness exited: " + st + ". Showing the last snapshot. Restart it with:"
    : "Dashboard disconnected — retrying.");
  const cmd = terminal && latest.status ? (latest.status.resume_cmd || "") : "";
  const code = $("bannerCmd"), copy = $("bannerCopy");
  setText(code, cmd);
  code.hidden = !cmd;
  copy.hidden = !cmd;
  copy.setAttribute("data-cmd", cmd);
  if (terminal && !cmd) setText($("bannerText"), "Harness exited: " + st + ". Showing the last snapshot.");
  b.hidden = false;
}

let es = null;
function connect() {
  es = new EventSource("/events");
  es.onopen = () => setBanner(false);
  es.onmessage = e => { setBanner(false); try { render(JSON.parse(e.data)); } catch (_) {} };
  es.onerror = () => { es.close(); setBanner(true); setTimeout(connect, 2000); };
}

if (location.hash === "#mock") {
  render(MOCK);
} else {
  fetch("/api/state").then(r => r.json()).then(render).catch(() => setBanner(true));
  connect();
}
</script>
</body>
</html>
