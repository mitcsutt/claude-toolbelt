name: Docs deploy

# Deploys the docs site to the Cloudflare Worker `claude-toolbelt-docs`. Never part of the CI gate.
# The Worker, its custom domain and the two secrets below are set up outside this repo.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'plugins/**'
      - 'docs/**'
      - 'rules/**'
      - 'config/**'
      - 'scripts/**'
      - '.claude-plugin/**'
      - '**.md'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    # A fork has no secrets, and its deploy must never run.
    if: github.repository == 'mitcsutt/claude-toolbelt'
    runs-on: ubuntu-latest
    environment: docs-production
    defaults:
      run:
        working-directory: site
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check links
        run: pnpm check-links

      # The same token can redeploy any Worker in the account, so refuse any name but ours.
      - name: Check the Worker name
        run: grep -qE '^\s*"name":\s*"claude-toolbelt-docs",' wrangler.jsonc

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
