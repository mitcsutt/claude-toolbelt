name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'

      # Needed for `claude plugin validate --strict`, which scripts/validate.sh
      # silently skips when the CLI is absent. Runs unauthenticated — no keys.
      # Never used to run evals: those cost money and are run manually only.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run checks
        run: bash scripts/test-all.sh
